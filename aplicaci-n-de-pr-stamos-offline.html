<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>Inversiones Nova R &amp; L — Préstamos</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #ffffff;
        --surface-2: #f7f8fa;
        --ink: #111318;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --accent-soft: #eff4ff;
        --danger: #dc2626;
        --danger-soft: #fef2f2;
        --ok: #15803d;
        --ok-soft: #f0fdf4;
        --shadow: 0 8px 30px rgba(17, 19, 24, 0.10);
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        overscroll-behavior: none;
      }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }
      .hidden { display: none !important; }

      /* ---------- Login ---------- */
      .login-wrap {
        height: 100dvh;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        padding: 24px 20px;
      }
      .login-card { width: 100%; max-width: 360px; margin: auto; }
      .brand { text-align: center; margin-bottom: 32px; }
      .brand .logo { width: 76px; height: 76px; margin: 0 auto 14px; }
      .brand h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.02em; }
      .brand p { margin: 0; color: var(--muted); font-size: 14px; }
      .field { margin-bottom: 14px; }
      .field label {
        display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px;
      }
      .field input, .field select, .field textarea {
        width: 100%; padding: 12px 14px; font-size: 16px;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--surface); color: var(--ink);
        outline: none;
      }
      .field input:focus, .field select:focus, .field textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-soft);
      }
      .field textarea { resize: vertical; min-height: 64px; }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        border: 1px solid transparent; border-radius: 10px;
        padding: 12px 18px; font-size: 15px; font-weight: 600;
        background: var(--accent); color: #fff; text-decoration: none;
        transition: background 0.15s ease;
      }
      .btn:hover { background: var(--accent-dark); }
      .btn.block { width: 100%; }
      .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
      .btn.ghost:hover { background: var(--surface-2); }
      .btn.danger { background: var(--danger); color: #fff; }
      .btn.small { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
      .form-error {
        background: var(--danger-soft); color: var(--danger);
        border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-bottom: 14px;
      }
      .login-note { text-align: center; color: var(--muted); font-size: 12.5px; margin-top: 18px; line-height: 1.5; }
      .or-divider {
        display: flex; align-items: center; gap: 12px; margin: 18px 0 14px;
        color: var(--muted); font-size: 12.5px;
      }
      .or-divider::before, .or-divider::after {
        content: ""; flex: 1; height: 1px; background: var(--line);
      }
      .faceid-msg {
        background: var(--accent-soft); color: var(--accent-dark);
        border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 12px; line-height: 1.5;
      }

      /* ---------- App shell ---------- */
      .shell { max-width: 600px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column; }
      header.appbar {
        position: sticky; top: 0; z-index: 20;
        display: flex; align-items: center; gap: 10px;
        padding: 12px 16px;
        background: var(--bg); border-bottom: 1px solid var(--line);
      }
      header.appbar .logo { width: 34px; height: 34px; flex: none; }
      header.appbar .title { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; line-height: 1.15; }
      header.appbar .subtitle { font-size: 11.5px; color: var(--muted); }
      header.appbar .spacer { flex: 1; }
      .logout-btn {
        background: transparent; border: 1px solid var(--line); color: var(--ink);
        border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 600;
      }
      main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 18px 16px 96px; }
      nav.tabbar {
        position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 100%; max-width: 600px; z-index: 20;
        display: flex; background: var(--surface); border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom);
      }
      nav.tabbar button {
        flex: 1; background: none; border: none; padding: 10px 4px 8px;
        color: var(--muted); font-size: 11.5px; font-weight: 600;
        display: flex; flex-direction: column; align-items: center; gap: 3px;
      }
      nav.tabbar button svg { width: 22px; height: 22px; }
      nav.tabbar button.active { color: var(--accent); }

      /* ---------- Content ---------- */
      .view-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
      .view-head h2 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
      .stat {
        border: 1px solid var(--line); border-radius: 12px; padding: 14px;
        background: var(--surface);
      }
      .stat .label { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
      .stat .value { font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
      .stat .value.blue { color: var(--accent); }
      .stat .value.red { color: var(--danger); }
      .stat .value.green { color: var(--ok); }
      .section-title { font-size: 15px; font-weight: 700; margin: 22px 0 10px; }
      .card {
        border: 1px solid var(--line); border-radius: 12px; padding: 14px;
        background: var(--surface); margin-bottom: 10px;
      }
      .card.clickable { cursor: pointer; }
      .card.clickable:hover { border-color: var(--accent); }
      .row { display: flex; align-items: center; gap: 10px; }
      .row .grow { flex: 1; min-width: 0; }
      .avatar {
        flex: none; border-radius: 50%; color: #fff;
        width: 44px; height: 44px; font-size: 16px;
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; letter-spacing: 0.02em;
      }
      .avatar.big { width: 54px; height: 54px; font-size: 19px; }
      .name { font-weight: 650; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
      .amount { font-weight: 700; font-size: 15.5px; white-space: nowrap; }
      .chip {
        display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px;
        border-radius: 999px; letter-spacing: 0.02em;
      }
      .chip.blue { background: var(--accent-soft); color: var(--accent); }
      .chip.red { background: var(--danger-soft); color: var(--danger); }
      .chip.green { background: var(--ok-soft); color: var(--ok); }
      .chip.gray { background: var(--surface-2); color: var(--muted); }
      .progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 10px; border: 1px solid var(--line); }
      .progress > div { height: 100%; background: var(--accent); border-radius: 999px; }
      .icon-actions { display: flex; gap: 8px; flex: none; }
      .icon-btn {
        width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line);
        background: var(--surface); display: inline-flex; align-items: center; justify-content: center;
        color: var(--ink); text-decoration: none;
      }
      .icon-btn svg { width: 18px; height: 18px; }
      .icon-btn.wa { color: #128c4b; }
      .search {
        width: 100%; padding: 11px 14px; font-size: 16px; margin-bottom: 14px;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--surface); color: var(--ink); outline: none;
      }
      .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
      .empty {
        text-align: center; color: var(--muted); padding: 36px 20px;
        border: 1px dashed var(--line); border-radius: 12px; font-size: 14.5px; line-height: 1.55;
      }
      .empty strong { color: var(--ink); display: block; font-size: 16px; margin-bottom: 4px; }
      .kv { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
      .kv:last-child { border-bottom: none; }
      .kv .k { color: var(--muted); }
      .kv .v { font-weight: 600; text-align: right; }
      .back-btn { background: none; border: none; color: var(--accent); font-size: 15px; font-weight: 600; padding: 0 0 14px; }
      .installment { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
      .installment:last-child { border-bottom: none; }
      .installment .n { width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
      .installment.paid .n { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
      .installment.overdue .n { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
      .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
      .btn-row .btn { flex: 1; min-width: 130px; }

      /* ---------- Modal ---------- */
      .modal-backdrop {
        position: fixed; inset: 0; background: rgba(10, 10, 12, 0.5); z-index: 50;
        display: flex; align-items: flex-end; justify-content: center;
      }
      @media (min-width: 640px) { .modal-backdrop { align-items: center; padding: 20px; } }
      .modal {
        background: var(--surface); width: 100%; max-width: 480px; max-height: 92dvh;
        overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px;
      }
      @media (min-width: 640px) { .modal { border-radius: 16px; } }
      .modal h3 { margin: 0 0 16px; font-size: 18px; letter-spacing: -0.01em; }
      .modal .preview {
        background: var(--accent-soft); border-radius: 10px; padding: 12px 14px;
        font-size: 14px; margin-bottom: 14px; line-height: 1.6;
      }

      /* ---------- Toast ---------- */
      .toast {
        position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%);
        background: var(--ink); color: var(--bg); padding: 11px 18px; border-radius: 999px;
        font-size: 14px; font-weight: 600; z-index: 80; box-shadow: var(--shadow);
        max-width: calc(100vw - 32px); text-align: center;
      }
      .note-box {
        background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px;
        padding: 14px; font-size: 13.5px; color: var(--muted); line-height: 1.6; margin-bottom: 14px;
      }
      .note-box strong { color: var(--ink); }
    </style>
  </head>
  <body>
    <!-- ============ LOGIN ============ -->
    <div id="loginView" class="login-wrap hidden">
      <div class="login-card">
        <div class="brand">
          <div class="logo" id="loginLogo"></div>
          <h1>Inversiones Nova R &amp; L</h1>
          <p>Control de préstamos</p>
        </div>
        <form id="loginForm" autocomplete="off">
          <div id="loginError" class="form-error hidden">Usuario o contraseña incorrectos.</div>
          <div class="field">
            <label for="loginUser">Usuario</label>
            <input id="loginUser" type="text" autocapitalize="none" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="loginPass">Contraseña</label>
            <input id="loginPass" type="password" autocomplete="current-password" required />
          </div>
          <button class="btn block" type="submit">Entrar</button>
        </form>
        <div id="faceIdArea" class="hidden">
          <div class="or-divider"><span>o</span></div>
          <button class="btn ghost block" type="button" id="faceIdBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true"><path d="M3 8V6a3 3 0 0 1 3-3h2"/><path d="M16 3h2a3 3 0 0 1 3 3v2"/><path d="M21 16v2a3 3 0 0 1-3 3h-2"/><path d="M8 21H6a3 3 0 0 1-3-3v-2"/><path d="M9 9v2"/><path d="M15 9v2"/><path d="M12 9v4a1.5 1.5 0 0 0 1.5 1.5"/><path d="M9.5 17.5c.7.6 1.6.9 2.5.9s1.8-.3 2.5-.9"/></svg>
            Entrar con Face ID
          </button>
          <div id="faceIdMsg" class="faceid-msg hidden"></div>
        </div>
        <p class="login-note" id="loginNote">Tus datos se guardan en este teléfono.<br />La sincronización en la nube es opcional y va cifrada.</p>
      </div>
    </div>

    <!-- ============ APP ============ -->
    <div id="appView" class="shell hidden">
      <header class="appbar">
        <div class="logo" id="appLogo"></div>
        <div>
          <div class="title">Inversiones Nova R &amp; L</div>
          <div class="subtitle">Préstamos · datos en este teléfono</div>
        </div>
        <div class="spacer"></div>
        <button class="logout-btn" id="logoutBtn" type="button">Salir</button>
      </header>
      <main id="mainView"></main>
      <nav class="tabbar" id="tabbar">
        <button type="button" data-tab="resumen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l9-9 9 9"/><path d="M5 10v10h14V10"/></svg>
          Resumen
        </button>
        <button type="button" data-tab="clientes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M3.5 20c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><path d="M16 5.4a3.5 3.5 0 0 1 0 6.2"/><path d="M17.5 15.4c1.7.7 2.7 2.2 3 4.6"/></svg>
          Clientes
        </button>
        <button type="button" data-tab="prestamos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><path d="M7 15h4"/></svg>
          Préstamos
        </button>
        <button type="button" data-tab="ganancias">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
          Ganancias
        </button>
        <button type="button" data-tab="ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
          Respaldo
        </button>
      </nav>
    </div>

    <div id="modalRoot"></div>
    <div id="toastRoot"></div>

    <script>
      "use strict";

      /* ================= Logo (N con flecha de crecimiento) ================= */
      var LOGO_SVG =
        '<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Inversiones Nova R y L">' +
        '<rect x="2" y="2" width="60" height="60" rx="14" fill="#2563eb"/>' +
        '<path d="M20 46V18l24 28V18" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M14 14l10 2-2 10" stroke="#93c5fd" stroke-width="0" fill="none"/>' +
        '<path d="M40 12h12v12" stroke="#bfdbfe" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>' +
        '<path d="M52 12L36 26" stroke="#bfdbfe" stroke-width="4.5" stroke-linecap="round"/>' +
        "</svg>";
      document.getElementById("loginLogo").innerHTML = LOGO_SVG;
      document.getElementById("appLogo").innerHTML = LOGO_SVG;

      /* ================= Constantes ================= */
      var LOGIN_USER = "rnova";
      var LOGIN_HASH = "1f0a980f0ca8cb3b1129b0807751ede476c61071f25c6b56a472bf057ffe4216";
      var SESSION_KEY = "nova_session_v1";
      var DATA_KEY = "nova_data_v1";
      var FACEID_KEY = "nova_faceid_v1";

      /* ================= SHA-256 (WebCrypto con respaldo en JS puro) ================= */
      function sha256Hex(str) {
        if (window.crypto && crypto.subtle && window.TextEncoder) {
          return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function (buf) {
            return Array.prototype.map
              .call(new Uint8Array(buf), function (b) { return ("0" + b.toString(16)).slice(-2); })
              .join("");
          }).catch(function () { return Promise.resolve(sha256Js(str)); });
        }
        return Promise.resolve(sha256Js(str));
      }
      // Implementación compacta de SHA-256 (dominio público, estilo geraintluff)
      function sha256Js(ascii) {
        function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
        var mathPow = Math.pow, maxWord = mathPow(2, 32), result = "";
        var words = [], asciiBitLength = ascii.length * 8;
        var hash = (sha256Js.h = sha256Js.h || []), k = (sha256Js.k = sha256Js.k || []);
        var primeCounter = k.length, isComposite = {};
        for (var candidate = 2; primeCounter < 64; candidate++) {
          if (!isComposite[candidate]) {
            for (var i = 0; i < 313; i += candidate) isComposite[i] = candidate;
            hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
            k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
          }
        }
        ascii += "\x80";
        while ((ascii.length % 64) - 56) ascii += "\x00";
        for (var j = 0; j < ascii.length; j++) {
          var code = ascii.charCodeAt(j);
          if (code >> 8) return sha256Hex(unescape(encodeURIComponent(ascii)));
          words[j >> 2] |= code << (((3 - j) % 4) * 8);
        }
        words[words.length] = (asciiBitLength / maxWord) | 0;
        words[words.length] = asciiBitLength;
        for (var block = 0; block < words.length;) {
          var w = words.slice(block, (block += 16)), oldHash = hash;
          hash = hash.slice(0, 8);
          for (var n = 0; n < 64; n++) {
            var w15 = w[n - 15], w2 = w[n - 2];
            var a = hash[0], e = hash[4];
            var temp1 =
              hash[7] +
              (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) +
              ((e & hash[5]) ^ (~e & hash[6])) +
              k[n] +
              (w[n] =
                n < 16
                  ? w[n]
                  : (w[n - 16] +
                      (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) +
                      w[n - 7] +
                      (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) |
                    0);
            var temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
          }
          for (var m = 0; m < 8; m++) hash[m] = (hash[m] + oldHash[m]) | 0;
        }
        for (var p = 0; p < 8; p++) {
          for (var q = 3; q + 1; q--) {
            var byte = (hash[p] >> (q * 8)) & 255;
            result += (byte < 16 ? "0" : "") + byte.toString(16);
          }
        }
        return result;
      }

      /* ================= Datos (localStorage) ================= */
      var data = loadData();
      function loadData() {
        try {
          var raw = localStorage.getItem(DATA_KEY);
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.clients) && Array.isArray(parsed.loans) && Array.isArray(parsed.payments)) {
              return parsed;
            }
          }
        } catch (e) { /* datos corruptos: arrancar vacío */ }
        return { clients: [], loans: [], payments: [] };
      }
      function saveData() {
        try { localStorage.setItem(DATA_KEY, JSON.stringify(data)); }
        catch (e) { toast("No se pudo guardar en el teléfono (almacenamiento lleno)."); }
        scheduleSync();
      }
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      }

      /* ================= Utilidades ================= */
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      }
      var moneyFmt = new Intl.NumberFormat("es-DO", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      function money(n) { return "RD$ " + moneyFmt.format(Number(n) || 0); }
      function round2(n) { return Math.round((Number(n) + Number.EPSILON) * 100) / 100; }
      function parseDate(str) {
        var p = String(str).split("-");
        return new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
      }
      function toISODate(d) {
        var m = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function todayISO() { return toISODate(new Date()); }
      var dateFmt = new Intl.DateTimeFormat("es-DO", { day: "numeric", month: "short", year: "numeric" });
      function fmtDate(iso) { try { return dateFmt.format(parseDate(iso)); } catch (e) { return iso; } }
      var dateTimeFmt = new Intl.DateTimeFormat("es-DO", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
      function fmtDateTime(iso) { try { return dateTimeFmt.format(new Date(iso)); } catch (e) { return iso; } }
      function addPeriod(iso, freq) {
        var d = parseDate(iso);
        if (freq === "semanal") d.setDate(d.getDate() + 7);
        else if (freq === "quincenal") d.setDate(d.getDate() + 14);
        else { d.setMonth(d.getMonth() + 1); }
        return toISODate(d);
      }
      function freqLabel(freq) {
        return freq === "semanal" ? "Semanal" : freq === "quincenal" ? "Quincenal" : "Mensual";
      }
      // Registros vivos: lo eliminado queda como lápida (deleted:true) para poder fusionar en la sincronización
      function isLive(r) { return !!r && !r.deleted; }
      function liveClients() { return data.clients.filter(isLive); }
      function liveLoans() { return data.loans.filter(isLive); }
      function livePayments() { return data.payments.filter(isLive); }
      function clientById(id) {
        for (var i = 0; i < data.clients.length; i++) if (data.clients[i].id === id && isLive(data.clients[i])) return data.clients[i];
        return null;
      }
      function loanById(id) {
        for (var i = 0; i < data.loans.length; i++) if (data.loans[i].id === id && isLive(data.loans[i])) return data.loans[i];
        return null;
      }
      function paymentById(id) {
        for (var i = 0; i < data.payments.length; i++) if (data.payments[i].id === id && isLive(data.payments[i])) return data.payments[i];
        return null;
      }
      function loanPayments(loanId) {
        return data.payments
          .filter(function (p) { return p.loanId === loanId && isLive(p); })
          .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      }
      function loanPaid(loan) {
        return round2(loanPayments(loan.id).reduce(function (s, p) { return s + Number(p.amount); }, 0));
      }
      function loanBalance(loan) { return round2(Number(loan.total) - loanPaid(loan)); }
      // Interés calculado: siempre se deriva de (total a pagar − monto prestado)
      function loanInterestAmount(loan) { return round2(Number(loan.total) - Number(loan.amount)); }
      function loanInterestPct(loan) {
        if (loan.interest != null && loan.interest !== "" && !isNaN(Number(loan.interest))) return Number(loan.interest);
        if (Number(loan.amount) > 0) return round2((Number(loan.total) - Number(loan.amount)) / Number(loan.amount) * 100);
        return 0;
      }
      // Monto de la cuota: el guardado en préstamos nuevos; en los antiguos se toma de su plan
      function loanCuota(loan) {
        if (loan.cuota != null && Number(loan.cuota) > 0) return round2(Number(loan.cuota));
        if (loan.installments && loan.installments.length) return round2(Number(loan.installments[0].amount));
        return 0;
      }
      // Estado de cada cuota según los pagos acumulados (en orden de fecha)
      function installmentStates(loan) {
        var paid = loanPaid(loan);
        var acc = 0;
        return loan.installments.map(function (inst) {
          var covered = round2(Math.min(Math.max(paid - acc, 0), Number(inst.amount)));
          acc = round2(acc + Number(inst.amount));
          var today = todayISO();
          var status = "pendiente";
          if (covered >= Number(inst.amount)) status = "pagada";
          else if (inst.due < today) status = "vencida";
          return { n: inst.n, due: inst.due, amount: Number(inst.amount), covered: covered, status: status };
        });
      }
      function loanStatus(loan) {
        if (loanBalance(loan) <= 0) return { key: "saldado", label: "Saldado", chip: "green" };
        var states = installmentStates(loan);
        for (var i = 0; i < states.length; i++) {
          if (states[i].status === "vencida") return { key: "mora", label: "En mora", chip: "red" };
        }
        return { key: "activo", label: "Activo", chip: "blue" };
      }
      function nextDue(loan) {
        var states = installmentStates(loan);
        for (var i = 0; i < states.length; i++) if (states[i].status !== "pagada") return states[i];
        return null;
      }
      function toast(msg) {
        var root = document.getElementById("toastRoot");
        root.innerHTML = '<div class="toast">' + esc(msg) + "</div>";
        setTimeout(function () { root.innerHTML = ""; }, 2600);
      }

      /* ================= Sesión ================= */
      var currentTab = "resumen";
      var detail = null; // {type:'client'|'loan', id}
      var clientSearch = "";
      var loanSearch = "";
      var gananciasMonth = todayISO().slice(0, 7);

      function isLoggedIn() {
        try { return sessionStorage.getItem(SESSION_KEY) === "1"; } catch (e) { return false; }
      }
      function startSession() {
        try { sessionStorage.setItem(SESSION_KEY, "1"); } catch (e) {}
        showApp();
      }
      function showLogin() {
        document.getElementById("loginView").classList.remove("hidden");
        document.getElementById("appView").classList.add("hidden");
        var note = document.getElementById("loginNote");
        if (note) {
          note.innerHTML = syncEnabled()
            ? "Sincronización en la nube activada:<br />tus datos cifrados se sincronizan entre tus teléfonos."
            : "Tus datos se guardan en este teléfono.<br />La sincronización en la nube es opcional y va cifrada.";
        }
        refreshFaceIdLogin();
      }
      function showApp() {

      document.getElementById("loginForm").addEventListener("submit", function (ev) {
        ev.preventDefault();
        var user = document.getElementById("loginUser").value.trim();
        var pass = document.getElementById("loginPass").value;
        var err = document.getElementById("loginError");
        sha256Hex(pass).then(function (hash) {
          if (user === LOGIN_USER && hash === LOGIN_HASH) {
            err.classList.add("hidden");
            document.getElementById("loginPass").value = "";
            startSession();
            offerFaceIdSetup();
          } else {
            err.classList.remove("hidden");
          }
        });
      });
      document.getElementById("logoutBtn").addEventListener("click", function () {
        try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
        detail = null;
        showLogin();
      });

      /* ================= Face ID (llave de acceso / WebAuthn) ================= */
      function webauthnSupported() {
        return !!(window.PublicKeyCredential && navigator.credentials &&
          typeof navigator.credentials.create === "function" &&
          typeof navigator.credentials.get === "function");
      }
      function faceIdRegistered() {
        try { return !!localStorage.getItem(FACEID_KEY); } catch (e) { return false; }
      }
      function b64urlEncode(buf) {
        var bytes = new Uint8Array(buf);
        var s = "";
        for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
        return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
      }
      function b64urlDecode(str) {
        var s = String(str).replace(/-/g, "+").replace(/_/g, "/");
        while (s.length % 4) s += "=";
        var bin = atob(s);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
      }
      function randomBytes(n) {
        var b = new Uint8Array(n);
        crypto.getRandomValues(b);
        return b;
      }
      function refreshFaceIdLogin() {
        var area = document.getElementById("faceIdArea");
        if (!area) return;
        var show = webauthnSupported() && faceIdRegistered();
        area.classList.toggle("hidden", !show);
        if (show) document.getElementById("faceIdMsg").classList.add("hidden");
      }
      function faceIdErrorMsg(msg) {
        var box = document.getElementById("faceIdMsg");
        box.textContent = msg;
        box.classList.remove("hidden");
      }
      function registerFaceId() {
        return navigator.credentials.create({
          publicKey: {
            challenge: randomBytes(32),
            rp: { name: "Inversiones Nova R & L", id: location.hostname },
            user: {
              id: randomBytes(16),
              name: LOGIN_USER,
              displayName: "Inversiones Nova R & L"
            },
            pubKeyCredParams: [
              { type: "public-key", alg: -7 },
              { type: "public-key", alg: -257 }
            ],
            authenticatorSelection: {
              authenticatorAttachment: "platform",
              userVerification: "required",
              residentKey: "preferred"
            },
            timeout: 60000,
            attestation: "none"
          }
        }).then(function (cred) {
          if (!cred) throw new Error("sin-credencial");
          try { localStorage.setItem(FACEID_KEY, b64urlEncode(cred.rawId)); } catch (e) {}
        });
      }
      function loginWithFaceId() {
        var stored = null;
        try { stored = localStorage.getItem(FACEID_KEY); } catch (e) {}
        if (!stored) {
          faceIdErrorMsg("No hay una llave de Face ID registrada en este dispositivo. Entra con tu contraseña.");
          return;
        }
        navigator.credentials.get({
          publicKey: {
            challenge: randomBytes(32),
            rpId: location.hostname,
            allowCredentials: [{ type: "public-key", id: b64urlDecode(stored) }],
            userVerification: "required",
            timeout: 60000
          }
        }).then(function (assertion) {
          if (!assertion) throw new Error("sin-respuesta");
          document.getElementById("loginError").classList.add("hidden");
          startSession();
        }).catch(function () {
          faceIdErrorMsg("No se pudo entrar con Face ID. Puedes entrar con tu usuario y contraseña.");
        });
      }
      document.getElementById("faceIdBtn").addEventListener("click", loginWithFaceId);
      // Tras entrar con contraseña, ofrecer activar Face ID si aún no está activo
      function offerFaceIdSetup() {
        if (!webauthnSupported() || faceIdRegistered()) return;
        openModal(
          "<h3>Entrar con Face ID</h3>" +
          "<p style='color:var(--muted);line-height:1.6'>Activa Face ID en este dispositivo para entrar la próxima vez con tu rostro, sin escribir la contraseña. Tu contraseña seguirá funcionando como respaldo.</p>" +
          '<div class="btn-row"><button type="button" class="btn ghost" data-close>Ahora no</button>' +
          '<button type="button" class="btn" id="faceIdActivate">Activar Face ID</button></div>'
        );
        document.querySelector("[data-close]").addEventListener("click", closeModal);
        document.getElementById("faceIdActivate").addEventListener("click", function () {
          registerFaceId().then(function () {
            closeModal();
            toast("Face ID activado en este dispositivo.");
          }).catch(function () {
            closeModal();
            toast("No se pudo activar Face ID. Puedes intentarlo desde la pestaña Respaldo.");
          });
        });
      }

      /* ================= Navegación ================= */
      document.getElementById("tabbar").addEventListener("click", function (ev) {
        var btn = ev.target.closest("button[data-tab]");
        if (!btn) return;
        currentTab = btn.getAttribute("data-tab");
        detail = null;
        render();
      });
      function setTab(tab) { currentTab = tab; detail = null; render(); }

      function render() {
        var tabs = document.querySelectorAll("#tabbar button");
        tabs.forEach(function (b) {
          b.classList.toggle("active", b.getAttribute("data-tab") === currentTab && !detail);
        });
        var main = document.getElementById("mainView");
        if (detail && detail.type === "client") main.innerHTML = viewClientDetail(detail.id);
        else if (detail && detail.type === "loan") main.innerHTML = viewLoanDetail(detail.id);
        else if (currentTab === "resumen") main.innerHTML = viewResumen();
        else if (currentTab === "clientes") main.innerHTML = viewClientes();
        else if (currentTab === "prestamos") main.innerHTML = viewPrestamos();
        else if (currentTab === "ganancias") main.innerHTML = viewGanancias();
        else if (currentTab === "ajustes") main.innerHTML = viewAjustes();
        bindView(main);
        main.scrollTop = 0;
      }

      /* ================= Vista: Resumen ================= */
      function viewResumen() {
        var porCobrar = 0, cobrado = 0, enMora = 0, activos = 0;
        liveLoans().forEach(function (loan) {
          var bal = loanBalance(loan);
          porCobrar += bal;
          cobrado += loanPaid(loan);
          var st = loanStatus(loan);
          if (st.key === "mora") enMora++;
          if (st.key !== "saldado") activos++;
        });
        var today = todayISO();
        var limit = toISODate(new Date(Date.now() + 7 * 86400000));
        var upcoming = [];
        liveLoans().forEach(function (loan) {
          if (loanBalance(loan) <= 0) return;
          installmentStates(loan).forEach(function (s) {
            if (s.status !== "pagada" && s.due >= today && s.due <= limit) {
              upcoming.push({ loan: loan, state: s });
            }
          });
        });
        upcoming.sort(function (a, b) { return a.state.due < b.state.due ? -1 : 1; });

        var html = "<h2 style='margin:0 0 16px;font-size:22px;letter-spacing:-0.02em;'>Resumen</h2>";
        html += '<div class="grid2">' +
          statCard("Saldo por cobrar", money(porCobrar), "blue") +
          statCard("Total cobrado", money(cobrado), "green") +
          statCard("Préstamos activos", String(activos), "") +
          statCard("En mora", String(enMora), enMora > 0 ? "red" : "") +
          "</div>";

        html += '<div class="section-title">Vencen en los próximos 7 días</div>';
        if (upcoming.length === 0) {
          html += '<div class="empty">No hay cuotas por vencer en los próximos 7 días.</div>';
        } else {
          upcoming.forEach(function (u) {
            var c = clientById(u.loan.clientId);
            var rest = round2(u.state.amount - u.state.covered);
            html += '<div class="card clickable" data-open-loan="' + esc(u.loan.id) + '">' +
              '<div class="row"><div class="grow">' +
              '<div class="name">' + esc(c ? c.name : "Cliente") + '</div>' +
              '<div class="sub">Cuota #' + u.state.n + ' · vence ' + fmtDate(u.state.due) + '</div>' +
              '</div><div class="amount">' + money(rest) + "</div></div></div>";
          });
        }

        if (enMora > 0) {
          html += '<div class="section-title">Préstamos en mora</div>';
          liveLoans().forEach(function (loan) {
            if (loanStatus(loan).key !== "mora") return;
            var c = clientById(loan.clientId);
            html += '<div class="card clickable" data-open-loan="' + esc(loan.id) + '">' +
              '<div class="row"><div class="grow">' +
              '<div class="name">' + esc(c ? c.name : "Cliente") + '</div>' +
              '<div class="sub">Saldo pendiente</div></div>' +
              '<div style="text-align:right"><div class="amount">' + money(loanBalance(loan)) + '</div>' +
              '<span class="chip red">En mora</span></div></div></div>';
          });
        }

        if (liveClients().length === 0 && liveLoans().length === 0) {
          html += '<div class="section-title">Para empezar</div>' +
            '<div class="empty"><strong>Tu app está vacía</strong>Agrega tu primer cliente y luego créale un préstamo con su plan de cuotas automático.</div>' +
            '<div class="btn-row"><button class="btn" data-action="new-client">Agregar cliente</button>' +
            '<button class="btn ghost" data-action="new-loan">Crear préstamo</button></div>';
        }
        return html;
      }
      function statCard(label, value, cls) {
        return '<div class="stat"><div class="label">' + esc(label) + '</div><div class="value ' + cls + '">' + esc(value) + "</div></div>";
      }

      /* ================= Vista: Clientes ================= */
      // Iniciales del cliente: primera letra del primer nombre + primera letra del apellido.
      // Una sola palabra: sus dos primeras letras. Nombre vacío: "?".
      function clientInitials(name) {
        var words = String(name || "").trim().split(/\s+/).filter(function (w) { return w.length > 0; });
        if (words.length === 0) return "?";
        if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
        return (words[0].charAt(0) + words[words.length - 1].charAt(0)).toUpperCase();
      }
      // Color de fondo del círculo: determinista según el nombre (paleta sobria azul/gris azulado/verde azulado)
      var AVATAR_COLORS = ["#2563eb", "#0369a1", "#0e7490", "#0f766e", "#475569", "#1e40af"];
      function clientAvatarColor(name) {
        var s = String(name || "").trim().toLowerCase();
        var h = 0;
        for (var i = 0; i < s.length; i++) h = ((h * 31) + s.charCodeAt(i)) >>> 0;
        return AVATAR_COLORS[h % AVATAR_COLORS.length];
      }
      function avatarHtml(name, big) {
        return '<div class="avatar' + (big ? " big" : "") + '" style="background:' + clientAvatarColor(name) + '" aria-hidden="true">' +
          esc(clientInitials(name)) + "</div>";
      }
      function phoneActions(c) {
        var digits = String(c.phone || "").replace(/\D/g, "");
        var html = '<div class="icon-actions">';
        if (digits) {
          html += '<a class="icon-btn" href="tel:+' + digits + '" aria-label="Llamar a ' + esc(c.name) + '">' +
            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.6 2z"/></svg></a>';
          html += '<a class="icon-btn wa" href="https://wa.me/' + digits + '" target="_blank" rel="noopener" aria-label="WhatsApp a ' + esc(c.name) + '">' +
            '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2a9.9 9.9 0 0 0-8.4 15.2L2 22l4.9-1.6A9.9 9.9 0 1 0 12.04 2zm0 18.1a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .9 1-2.9-.2-.3a8.2 8.2 0 1 1 6.7 3.6zm4.6-6.1c-.3-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4 0-.5.2-.8l.5-.6c.1-.2 0-.4 0-.5l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.9.9-1.1 2.2-.2 3.9a11.6 11.6 0 0 0 4.5 4.2c1.7.8 2.4.9 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2 0-.1-.2-.2-.5-.3z"/></svg></a>';
        }
        return html + "</div>";
      }
      function viewClientes() {
        var html = '<div class="view-head"><h2>Clientes</h2>' +
          '<button class="btn small" data-action="new-client">+ Nuevo</button></div>';
        html += '<input class="search" id="clientSearch" type="search" placeholder="Buscar cliente…" value="' + esc(clientSearch) + '" />';
        var list = liveClients().slice().sort(function (a, b) { return a.name.localeCompare(b.name); });
        if (clientSearch) {
          var q = clientSearch.toLowerCase();
          list = list.filter(function (c) { return c.name.toLowerCase().indexOf(q) >= 0; });
        }
        if (liveClients().length === 0) {
          html += '<div class="empty"><strong>Sin clientes todavía</strong>Toca «+ Nuevo» para registrar tu primer cliente.</div>';
        } else if (list.length === 0) {
          html += '<div class="empty">Ningún cliente coincide con la búsqueda.</div>';
        } else {
          list.forEach(function (c) {
            var loans = liveLoans().filter(function (l) { return l.clientId === c.id; });
            var deuda = loans.reduce(function (s, l) { return s + loanBalance(l); }, 0);
            html += '<div class="card"><div class="row">' +
              avatarHtml(c.name, false) +
              '<div class="grow clickable" data-open-client="' + esc(c.id) + '" style="cursor:pointer">' +
              '<div class="name">' + esc(c.name) + "</div>" +
              '<div class="sub">' + esc(c.phone || "Sin teléfono") +
              (loans.length ? " · " + loans.length + (loans.length === 1 ? " préstamo" : " préstamos") : "") +
              (deuda > 0 ? " · debe " + money(deuda) : "") +
              "</div></div>" + phoneActions(c) + "</div></div>";

        return html;
      }
      function viewClientDetail(id) {
        var c = clientById(id);
        if (!c) { detail = null; return viewClientes(); }
        var html = '<button class="back-btn" data-action="back-clientes">← Clientes</button>';
        html += '<div class="row" style="margin-bottom:14px">' + avatarHtml(c.name, true) + '<div class="grow">' +
          '<div class="name" style="font-size:20px">' + esc(c.name) + "</div>" +
          '<div class="sub">' + esc(c.cedula ? "Cédula " + c.cedula : "") + "</div></div>" +
          phoneActions(c) + "</div>";
        html += '<div class="card">' +
          kv("Teléfono", c.phone || "—") + kv("Cédula", c.cedula || "—") +
          kv("Dirección", c.address || "—") + kv("Notas", c.notes || "—") + "</div>";
        html += '<div class="btn-row">' +
          '<button class="btn" data-action="new-loan-for" data-id="' + esc(c.id) + '">Nuevo préstamo</button>' +
          '<button class="btn ghost" data-action="edit-client" data-id="' + esc(c.id) + '">Editar</button>' +
          '<button class="btn ghost" data-action="delete-client" data-id="' + esc(c.id) + '" style="color:var(--danger)">Eliminar</button></div>';
        var loans = liveLoans().filter(function (l) { return l.clientId === c.id; });
        html += '<div class="section-title">Préstamos de ' + esc(c.name.split(" ")[0]) + "</div>";
        if (loans.length === 0) {

      }
      function kv(k, v) {
        return '<div class="kv"><span class="k">' + esc(k) + '</span><span class="v">' + esc(v) + "</span></div>";
      }

      /* ================= Vista: Préstamos ================= */
      function loanCard(loan, showClient) {
        var c = clientById(loan.clientId);
        var st = loanStatus(loan);
        var paid = loanPaid(loan);
        var pct = loan.total > 0 ? Math.min(100, Math.round((paid / loan.total) * 100)) : 0;
        var nd = nextDue(loan);
        var html = '<div class="card clickable" data-open-loan="' + esc(loan.id) + '">' +
          '<div class="row"><div class="grow">' +
          '<div class="name">' + (showClient ? esc(c ? c.name : "Cliente") : money(loan.amount) + " · " + esc(freqLabel(loan.frequency))) + "</div>" +
          '<div class="sub">' + (showClient ? money(loan.amount) + " · " : "") +
          loan.installments.length + " cuotas · " + esc(freqLabel(loan.frequency)) +
          (nd ? " · próxima: " + fmtDate(nd.due) : "") + "</div></div>" +
          '<div style="text-align:right"><div class="amount">' + money(loanBalance(loan)) + '</div>' +
          '<div class="sub">saldo</div></div></div>' +
          '<div class="progress"><div style="width:' + pct + '%"></div></div>' +
          '<div class="row" style="margin-top:8px"><span class="chip ' + st.chip + '">' + st.label + "</span>" +
          '<span class="sub" style="margin:0">Pagado ' + money(paid) + " de " + money(loan.total) + "</span></div></div>";
        return html;
      }
      // Fecha de creación del préstamo: createdAt en los nuevos; en los anteriores se usa
      // updatedAt (que hasta ahora solo se fijaba al crearlos). Sin ninguna fecha: "" (va al final).
      function loanCreatedKey(loan) {
        return loan.createdAt || loan.updatedAt || "";
      }
      function loanMatchesSearch(loan, q) {
        var c = clientById(loan.clientId);
        var ql = q.toLowerCase();
        if (c && c.name.toLowerCase().indexOf(ql) >= 0) return true;
        if (c && String(c.cedula || "").toLowerCase().indexOf(ql) >= 0) return true;
        var qd = q.replace(/\D/g, "");
        if (qd) {
          if (c && String(c.phone || "").replace(/\D/g, "").indexOf(qd) >= 0) return true;
          if (c && String(c.cedula || "").replace(/\D/g, "").indexOf(qd) >= 0) return true;
          if (String(Math.round(Number(loan.amount) || 0)).indexOf(qd) >= 0) return true;
          if (String(Math.round(Number(loan.total) || 0)).indexOf(qd) >= 0) return true;
        }
        var qa = q.replace(/[^0-9.]/g, "");
        if (qa && qa !== qd && String(Number(loan.amount)).indexOf(qa) >= 0) return true;
        return false;
      }
      function viewPrestamos() {
        var html = '<div class="view-head"><h2>Préstamos</h2>' +
          '<button class="btn small" data-action="new-loan">+ Nuevo</button></div>';
        if (liveLoans().length === 0) {
          html += '<div class="empty"><strong>Sin préstamos todavía</strong>Crea un préstamo y la app genera el plan de cuotas automáticamente.</div>';
          return html;
        }
        html += '<input class="search" id="loanSearch" type="search" placeholder="Buscar por cliente, teléfono, cédula o monto…" value="' + esc(loanSearch) + '" />';
        var list = liveLoans().slice();
        if (loanSearch.trim()) {
          var q = loanSearch.trim();
          list = list.filter(function (l) { return loanMatchesSearch(l, q); });
        }
        // Del más reciente al más viejo; los que no tienen fecha de creación quedan al final
        list.sort(function (a, b) {
          var ka = loanCreatedKey(a), kb = loanCreatedKey(b);
          if (ka && kb) return ka < kb ? 1 : ka > kb ? -1 : 0;
          if (ka) return -1;
          if (kb) return 1;
          return 0;
        });
        if (list.length === 0) {
          html += '<div class="empty">Ningún préstamo coincide con la búsqueda.</div>';
        } else {
          list.forEach(function (loan) { html += loanCard(loan, true); });
        }
        return html;
      }

      /* ================= Vista: Ganancias ================= */
      function monthKey(iso) { return String(iso || "").slice(0, 7); }
      function monthLabel(mk) {
        var p = String(mk).split("-");
        var d = new Date(Number(p[0]), Number(p[1]) - 1, 1);
        var s = new Intl.DateTimeFormat("es-DO", { month: "long", year: "numeric" }).format(d);
        return s.charAt(0).toUpperCase() + s.slice(1);
      }
      // Interés ganado del mes: parte proporcional de interés de cada pago recibido en el mes
      function gananciasStats(mk) {
        var prestado = 0, cobrado = 0, interes = 0;
        liveLoans().forEach(function (loan) {
          if (monthKey(loan.startDate) === mk) prestado += Number(loan.amount);
        });
        livePayments().forEach(function (p) {
          if (monthKey(p.date) !== mk) return;
          cobrado += Number(p.amount);
          var loan = loanById(p.loanId);
          if (loan && Number(loan.total) > 0) {
            interes += Number(p.amount) * ((Number(loan.total) - Number(loan.amount)) / Number(loan.total));
          }
        });
        var activos = liveLoans().filter(function (l) { return loanBalance(l) > 0; }).length;
        return { prestado: round2(prestado), cobrado: round2(cobrado), interes: round2(interes), activos: activos };
      }
      function viewGanancias() {
        var s = gananciasStats(gananciasMonth);
        var html = "<h2 style='margin:0 0 16px;font-size:22px;letter-spacing:-0.02em;'>Ganancias</h2>";
        html += '<div class="field"><label for="gananciasMonth">Mes</label>' +
          '<input id="gananciasMonth" type="month" value="' + esc(gananciasMonth) + '" /></div>';
        html += '<div class="grid2">' +
          statCard("Prestado en el mes", money(s.prestado), "blue") +
          statCard("Cobrado en el mes", money(s.cobrado), "green") +
          statCard("Intereses ganados", money(s.interes), "green") +
          statCard("Préstamos activos", String(s.activos), "") +
          "</div>";
        html += '<button class="btn block" data-action="ganancias-pdf">Descargar reporte de ' + esc(monthLabel(gananciasMonth)) + " (PDF)</button>";
        html += '<div class="note-box" style="margin-top:14px">Los <strong>intereses ganados</strong> se calculan como la parte proporcional de interés de cada pago recibido en el mes seleccionado.</div>';

        var loansMes = liveLoans().filter(function (l) { return monthKey(l.startDate) === gananciasMonth; })
          .sort(function (a, b) { return a.startDate < b.startDate ? -1 : 1; });
        html += '<div class="section-title">Préstamos del mes</div>';
        if (loansMes.length === 0) {
          html += '<div class="empty">No se otorgaron préstamos en este mes.</div>';
        } else {
          loansMes.forEach(function (loan) { html += loanCard(loan, true); });
        }
        var paysMes = livePayments().filter(function (p) { return monthKey(p.date) === gananciasMonth; })
          .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
        html += '<div class="section-title">Pagos recibidos en el mes</div>';
        if (paysMes.length === 0) {
          html += '<div class="empty">No se recibieron pagos en este mes.</div>';
        } else {
          html += '<div class="card" style="padding-top:4px;padding-bottom:4px">';
          paysMes.slice().reverse().forEach(function (p) {
            var loan = loanById(p.loanId);
            var c = loan ? clientById(loan.clientId) : null;
            html += '<div class="installment"><div class="grow"><div style="font-weight:600">' + money(p.amount) + "</div>" +
              '<div class="sub">' + fmtDate(p.date) + " · " + esc(c ? c.name : "Cliente") + (p.note ? " · " + esc(p.note) : "") + "</div></div></div>";
          });
          html += "</div>";
        }
        return html;
      }

        html += '<div class="card"><div class="name" style="margin-bottom:4px">Sincronización en la nube</div>' +

          '<div class="field"><label for="syncUrl">URL del proyecto Supabase</label>' +
          '<input id="syncUrl" type="url" inputmode="url" autocapitalize="none" autocomplete="off" placeholder="https://tu-proyecto.supabase.co" value="' + esc(cfgS.url || "") + '" /></div>' +
          '<div class="field"><label for="syncKey">Clave anónima (anon key)</label>' +

          '<button class="btn block" data-action="sync-activate">Probar y activar</button>' +

              '<button class="btn ghost block" data-action="faceid-off" style="color:var(--danger)">Desactivar Face ID</button></div>';
          } else {
            html += '<div class="card"><div class="name" style="margin-bottom:4px">Face ID</div>' +
              '<div class="sub" style="margin-bottom:12px">Activa Face ID para entrar con tu rostro sin escribir la contraseña. Tu contraseña seguirá funcionando como respaldo.</div>' +
              '<button class="btn block" data-action="faceid-on">Activar Face ID</button></div>';
          }
        }
        html += '<div class="btn-row"><button class="btn ghost" data-action="logout">Cerrar sesión</button></div>';
        return html;
      }

      /* ================= Modales y formularios ================= */
      function openModal(html) {
        document.getElementById("modalRoot").innerHTML =
          '<div class="modal-backdrop" id="modalBackdrop"><div class="modal">' + html + "</div></div>";
        document.getElementById("modalBackdrop").addEventListener("click", function (ev) {
          if (ev.target.id === "modalBackdrop") closeModal();
        });
      }
      function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
      function modalButtons(submitLabel) {
        return '<div class="btn-row"><button type="button" class="btn ghost" data-close>Cancelar</button>' +
          '<button type="submit" class="btn">' + esc(submitLabel) + "</button></div>";
      }
      function bindModalCommon(form) {
        form.querySelectorAll("[data-close]").forEach(function (b) {
          b.addEventListener("click", closeModal);
        });
      }

      function openClientForm(client) {
        var isEdit = !!client;
        client = client || {};
        openModal(
          "<h3>" + (isEdit ? "Editar cliente" : "Nuevo cliente") + "</h3>" +
          '<form id="clientForm">' +
          '<div class="field"><label for="cf-name">Nombre *</label><input id="cf-name" required value="' + esc(client.name || "") + '" /></div>' +
          '<div class="field"><label for="cf-phone">Teléfono</label><input id="cf-phone" type="tel" value="' + esc(client.phone || "") + '" /></div>' +
          '<div class="field"><label for="cf-cedula">Cédula</label><input id="cf-cedula" value="' + esc(client.cedula || "") + '" /></div>' +
          '<div class="field"><label for="cf-address">Dirección</label><input id="cf-address" value="' + esc(client.address || "") + '" /></div>' +
          '<div class="field"><label for="cf-notes">Notas</label><textarea id="cf-notes">' + esc(client.notes || "") + "</textarea></div>" +
          modalButtons(isEdit ? "Guardar cambios" : "Agregar cliente") +
          "</form>"
        );
        var form = document.getElementById("clientForm");
        bindModalCommon(form);
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var values = {
            name: document.getElementById("cf-name").value.trim(),
            phone: document.getElementById("cf-phone").value.trim(),
            cedula: document.getElementById("cf-cedula").value.trim(),
            address: document.getElementById("cf-address").value.trim(),
            notes: document.getElementById("cf-notes").value.trim()
          };
          if (!values.name) return;
          if (isEdit) {
            var target = clientById(client.id);
            if (target) {
              Object.assign(target, values);
              target.updatedAt = new Date().toISOString();
            }
            toast("Cliente actualizado.");
          } else {
            values.id = uid();
            values.updatedAt = new Date().toISOString();
            data.clients.push(values);
            toast("Cliente agregado.");
          }
          saveData();
          closeModal();
          render();
        });
        document.getElementById("cf-name").focus({ preventScroll: true });
      }

      function buildSchedule(cuota, count, freq, startDate) {
        var cuotaR = round2(cuota);
        var total = round2(cuotaR * count);
        var installments = [];
        var due = startDate;
        for (var i = 1; i <= count; i++) {
          installments.push({ n: i, due: due, amount: cuotaR });
          due = addPeriod(due, freq);
        }
        return { total: total, installments: installments };
      }

      function openLoanForm(presetClientId) {
        if (liveClients().length === 0) {
          openModal("<h3>Primero agrega un cliente</h3><p style='color:var(--muted);line-height:1.6'>Para crear un préstamo necesitas al menos un cliente registrado.</p>" +
            '<div class="btn-row"><button class="btn ghost" data-close>Cancelar</button>' +
            '<button class="btn" id="goNewClient">Agregar cliente</button></div>');
          document.querySelector("[data-close]").addEventListener("click", closeModal);
          document.getElementById("goNewClient").addEventListener("click", function () { openClientForm(null); });
          return;
        }
        var options = liveClients().slice().sort(function (a, b) { return a.name.localeCompare(b.name); })
          .map(function (c) {
            return '<option value="' + esc(c.id) + '"' + (c.id === presetClientId ? " selected" : "") + ">" + esc(c.name) + "</option>";
          }).join("");
        openModal(
          "<h3>Nuevo préstamo</h3>" +
          '<form id="loanForm">' +
          '<div class="field"><label for="lf-client">Cliente</label><select id="lf-client">' + options + "</select></div>" +
          '<div class="field"><label for="lf-amount">Monto del préstamo (RD$) *</label><input id="lf-amount" type="number" min="1" step="0.01" required inputmode="decimal" /></div>' +
          '<div class="field"><label for="lf-cuota">Monto de la cuota (RD$) *</label><input id="lf-cuota" type="number" min="0.01" step="0.01" required inputmode="decimal" placeholder="Ej.: 1,200" /></div>' +
          '<div class="field"><label for="lf-count">Número de cuotas *</label><input id="lf-count" type="number" min="1" step="1" required inputmode="numeric" placeholder="Ej.: 10" /></div>' +
          '<div class="field"><label for="lf-freq">Frecuencia</label><select id="lf-freq">' +
          '<option value="semanal">Semanal</option><option value="quincenal">Quincenal</option><option value="mensual">Mensual</option></select></div>' +
          '<div class="field"><label for="lf-start">Fecha de la primera cuota</label><input id="lf-start" type="date" value="' + todayISO() + '" required /></div>' +
          '<div class="preview" id="lf-preview">Completa el monto, la cuota y el número de cuotas para ver el plan.</div>' +
          modalButtons("Crear préstamo") + "</form>"
        );
        var form = document.getElementById("loanForm");
        bindModalCommon(form);
        function updatePreview() {
          var amount = parseFloat(document.getElementById("lf-amount").value);
          var cuota = parseFloat(document.getElementById("lf-cuota").value);
          var count = parseInt(document.getElementById("lf-count").value, 10);
          var box = document.getElementById("lf-preview");
          if (amount > 0 && cuota > 0 && count >= 1) {
            var total = round2(cuota * count);
            var interes = round2(total - amount);
            var pct = round2((interes / amount) * 100);
            box.innerHTML = "Total a pagar: <strong>" + money(total) + "</strong> (" + money(cuota) + " × " + count + " cuotas)<br>" +
              "Interés total: <strong>" + money(interes) + "</strong> (" + pct + "%)";
          } else {
            box.textContent = "Completa el monto, la cuota y el número de cuotas para ver el plan.";
          }
        }
        ["lf-amount", "lf-cuota", "lf-count"].forEach(function (id) {
          document.getElementById(id).addEventListener("input", updatePreview);
        });
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();
          var amount = parseFloat(document.getElementById("lf-amount").value);
          var cuota = parseFloat(document.getElementById("lf-cuota").value);
          var count = parseInt(document.getElementById("lf-count").value, 10);
          var freq = document.getElementById("lf-freq").value;
          var start = document.getElementById("lf-start").value || todayISO();
          if (!(amount > 0) || !(cuota > 0) || !(count >= 1)) return;
          var sched = buildSchedule(cuota, count, freq, start);
          data.loans.push({
            id: uid(),
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString(),
            clientId: document.getElementById("lf-client").value,
            amount: round2(amount),
            cuota: round2(cuota),
            total: sched.total,
            frequency: freq,
            startDate: start,
            installments: sched.installments
          });
          saveData();
          closeModal();
          toast("Préstamo creado con " + count + " cuotas.");
          setTab("prestamos");
        });
      }

      function openPaymentForm(loan) {
        var nd = nextDue(loan);
        var suggested = nd ? round2(nd.amount - nd.covered) : loanBalance(loan);
        openModal(
          "<h3>Registrar pago</h3>" +
          '<form id="payForm">' +
          '<div class="preview">Saldo pendiente: <strong>' + money(loanBalance(loan)) + "</strong>" +
          (nd ? "<br>Próxima cuota: #" + nd.n + " · " + fmtDate(nd.due) : "") + "</div>" +
          '<div class="field"><label for="pf-amount">Monto (RD$) *</label><input id="pf-amount" type="number" min="0.01" step="0.01" required inputmode="decimal" value="' + suggested + '" /></div>' +
          '<div class="field"><label for="pf-date">Fecha</label><input id="pf-date" type="date" value="' + todayISO() + '" required /></div>' +
          '<div class="field"><label for="pf-note">Nota (opcional)</label><input id="pf-note" placeholder="Ej.: transferencia, efectivo…" /></div>' +
          modalButtons("Guardar pago") + "</form>"
        );
        var form = document.getElementById("payForm");
        bindModalCommon(form);
        form.addEventListener("submit", function (ev) {
          ev.preventDefault();

          loanSearchEl.addEventListener("input", function () {
            loanSearch = loanSearchEl.value;
            var pos = loanSearchEl.selectionStart;
            render();

        if (gmInput) {
          gmInput.addEventListener("change", function () {
            if (!gmInput.value) return;
            gananciasMonth = gmInput.value;

            // la vista no salta — se conserva la posición de desplazamiento
            // dentro del contenedor y el foco vuelve al campo sin desplazar.
            var mainEl = document.getElementById("mainView");
            var prevScroll = mainEl ? mainEl.scrollTop : 0;
            render();
            var mainAfter = document.getElementById("mainView");
            if (mainAfter) mainAfter.scrollTop = prevScroll;
            var againGm = document.getElementById("gananciasMonth");
            if (againGm) againGm.focus({ preventScroll: true });
          });
        }

        if (mainBound) return;
        mainBound = true;
        main.addEventListener("keydown", function (ev) {
          if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[data-open-loan],[data-open-client]")) {
            ev.preventDefault();
            ev.target.click();
          }
        });
        main.addEventListener("click", function (ev) {
          var openClient = ev.target.closest("[data-open-client]");
          if (openClient) { detail = { type: "client", id: openClient.getAttribute("data-open-client") }; render(); return; }
          var openLoan = ev.target.closest("[data-open-loan]");
          if (openLoan) { detail = { type: "loan", id: openLoan.getAttribute("data-open-loan") }; render(); return; }
          var el = ev.target.closest("[data-action]");
          if (!el) return;
          var action = el.getAttribute("data-action");
          var id = el.getAttribute("data-id");
          if (action === "new-client") openClientForm(null);
          else if (action === "edit-client") openClientForm(clientById(id));
          else if (action === "delete-client") {
            var c = clientById(id);
            openConfirm("Eliminar cliente", "Se eliminará a " + (c ? c.name : "este cliente") + " junto con sus préstamos y pagos. Esta acción no se puede deshacer.", "Eliminar", function () {
              var nowIso = new Date().toISOString();
              var loanIds = data.loans.filter(function (l) { return l.clientId === id; }).map(function (l) { return l.id; });
              data.clients.forEach(function (x) { if (x.id === id) { x.deleted = true; x.updatedAt = nowIso; } });
              data.loans.forEach(function (l) { if (l.clientId === id) { l.deleted = true; l.updatedAt = nowIso; } });
              data.payments.forEach(function (p) { if (loanIds.indexOf(p.loanId) >= 0) { p.deleted = true; p.updatedAt = nowIso; } });
              saveData(); detail = null; currentTab = "clientes"; render();
              toast("Cliente eliminado.");
            });
          }
          else if (action === "new-loan") openLoanForm(null);
          else if (action === "new-loan-for") openLoanForm(id);
          else if (action === "delete-loan") {
            openConfirm("Eliminar préstamo", "Se eliminará el préstamo y todos sus pagos registrados. Esta acción no se puede deshacer.", "Eliminar", function () {
              var nowIso = new Date().toISOString();
              data.payments.forEach(function (p) { if (p.loanId === id) { p.deleted = true; p.updatedAt = nowIso; } });
              data.loans.forEach(function (l) { if (l.id === id) { l.deleted = true; l.updatedAt = nowIso; } });
              saveData(); detail = null; currentTab = "prestamos"; render();
              toast("Préstamo eliminado.");
            });
          }
          else if (action === "new-payment") { var loan = loanById(id); if (loan) openPaymentForm(loan); }
          else if (action === "delete-payment") {
            data.payments.forEach(function (p) { if (p.id === id) { p.deleted = true; p.updatedAt = new Date().toISOString(); } });
            saveData(); render(); toast("Pago eliminado.");
          }
          else if (action === "back-clientes") { detail = null; currentTab = "clientes"; render(); }
          else if (action === "back-prestamos") { detail = null; currentTab = "prestamos"; render(); }
          else if (action === "export") exportBackup();
          else if (action === "export-pdf") exportPdf();
          else if (action === "export-xlsx") exportXlsx();
          else if (action === "receipt") { var pay = paymentById(id); if (pay) exportReceipt(pay); }
          else if (action === "loan-report") { var repLoan = loanById(id); if (repLoan) exportLoanReport(repLoan); }
          else if (action === "ganancias-pdf") exportGananciasPdf();
          else if (action === "sync-activate") activateSync();
          else if (action === "sync-now") {
            if (!syncEnabled()) toast("Primero escribe la URL y la clave anónima y toca «Probar y activar».");

            registerFaceId().then(function () {
              render();

              toast("No se pudo activar Face ID. Inténtalo de nuevo.");

            openConfirm("Desactivar Face ID", "Se eliminará la llave de acceso de este dispositivo y volverás a entrar con tu contraseña. Podrás activar Face ID de nuevo cuando quieras.", "Desactivar", function () {
              try { localStorage.removeItem(FACEID_KEY); } catch (e) {}
              render();
              toast("Face ID desactivado.");
            });
          }
          else if (action === "logout") document.getElementById("logoutBtn").click();
        });
      }

      /* ================= Reporte PDF (generador incluido en la app) ================= */
      function pdfClean(s) {
        return String(s == null ? "" : s)
          .replace(/[‘’]/g, "'")
          .replace(/[“”]/g, '"')
          .replace(/[–—]/g, "-")
          .replace(/…/g, "...")
          .replace(/[  ]/g, " ")
          .split("")
          .map(function (ch) { return ch.charCodeAt(0) > 255 ? "?" : ch; })
          .join("");
      }
      function pdfEsc(s) {
        return pdfClean(s).replace(/\\/g, "\\\\").replace(/\(/g, "\\(").replace(/\)/g, "\\)");
      }
      function pdfCharW(font, size) { return size * (font === "F3" ? 0.6 : font === "F2" ? 0.54 : 0.5); }
      function pdfWrap(text, font, size, maxWidth) {
        var maxChars = Math.max(8, Math.floor(maxWidth / pdfCharW(font, size)));
        var words = String(text).split(/\s+/);
        var lines = [], cur = "";
        words.forEach(function (w) {
          while (w.length > maxChars) {
            if (cur) { lines.push(cur); cur = ""; }
            lines.push(w.slice(0, maxChars));
            w = w.slice(maxChars);
          }
          if (!cur) cur = w;
          else if ((cur + " " + w).length <= maxChars) cur += " " + w;
          else { lines.push(cur); cur = w; }
        });
        if (cur || lines.length === 0) lines.push(cur);
        return lines;
      }
      function reportLines() {
        var L = [];
        function add(text, font, size, gap, indent, color, keep) {

        });

        liveLoans().forEach(function (loan) {

          add("Inicio: " + fmtDate(loan.startDate) + " · Cuota: " + money(loanCuota(loan)) + " · Interés: " + money(loanInterestAmount(loan)) + " (" + loanInterestPct(loan) + "%) · Total a pagar: " + money(loan.total) +
            " · Pagado: " + money(loanPaid(loan)) + " · Saldo: " + money(loanBalance(loan)), "F1", 10.5, 1, 12);
          add("Cuotas:", "F1", 10.5, 3, 12);
          installmentStates(loan).forEach(function (s) {
            var estado = s.status === "pagada" ? "Pagada" : s.status === "vencida" ? "Vencida" : "Pendiente";
            var extra = s.covered > 0 && s.status !== "pagada" ? " (abonado " + money(s.covered) + ")" : "";
            add("#" + s.n + " · vence " + fmtDate(s.due) + " · " + money(s.amount) + " · " + estado + extra, "F3", 9.5, 1, 24);

        livePayments().slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function (p) {
          var loan = loanById(p.loanId);

        });
        return L;
      }
      function downloadPdfLines(L, filename, headerLabel) {
        var W = 612, H = 792, M = 48;
        var raw = L;
        var pages = [[]];
        var y = H - M;
        function newPage() { pages.push([]); y = H - M; }
        raw.forEach(function (ln) {
          if (ln.logo) {
            if (y - 46 < M) newPage();
            pages[pages.length - 1].push({ logo: true, y: y - 38 });
            y -= 46;
            return;
          }
          if (ln.rule) {
            if (y - 12 < M) newPage();
            pages[pages.length - 1].push({ rule: true, y: y - 5 });
            y -= 12;
            return;
          }
          if (ln.band) {
            var bh = ln.h || 72;
            if (y - bh < M) newPage();
            pages[pages.length - 1].push({ band: true, title: ln.title || "", sub: ln.sub || "", meta: ln.meta || "", h: bh, y: y - bh });
            y -= bh + (ln.after != null ? ln.after : 12);
            return;
          }
          if (ln.frame) {
            pages[pages.length - 1].push({ frame: true, y: y });
            return;
          }
          if (ln.cols) {
            var csize = ln.size || 11;
            if (y - (ln.gap || 0) - csize * 1.45 < M) newPage();
            y -= ln.gap || 0;
            pages[pages.length - 1].push({
              cols: true, left: ln.left || "", right: ln.right || "",
              fontL: ln.fontL || ln.font || "F1", fontR: ln.fontR || ln.font || "F1",
              sizeL: ln.sizeL || csize, sizeR: ln.sizeR || csize,
              colorL: ln.colorL || ln.color || "", colorR: ln.colorR || ln.color || "",
              x: ln.x || 0, w: ln.w || 0, tc: ln.tc || 0,
              y: y - csize * 1.08
            });
            y -= csize * 1.45;
            return;
          }
          if (ln.bar) {
            if (y - 8 - 44 < M) newPage();
            y -= 8;
            pages[pages.length - 1].push({ bar: true, text: ln.text || "", size: ln.size || 15, y: y - 44 });
            y -= 44;
            return;
          }
          if (ln.box) {
            if (y - 10 - 40 < M) newPage();
            y -= 10;
            pages[pages.length - 1].push({ box: true, text: ln.text || "", size: ln.size || 13, y: y - 40 });
            y -= 40;
            return;
          }
          if (ln.rbox) {
            if (y - (ln.gap || 0) - 42 < M) newPage();
            y -= ln.gap || 0;
            pages[pages.length - 1].push({ rbox: true, left: ln.left || "", right: ln.right || "", y: y - 42 });
            y -= 42;
            return;
          }
          if (ln.ramount) {
            if (y - (ln.gap || 0) - 48 < M) newPage();
            y -= ln.gap || 0;
            pages[pages.length - 1].push({ ramount: true, label: ln.label || "", value: ln.value || "", y: y - 48 });
            y -= 48;

          if (ln.rsum3) {
            if (y - (ln.gap || 0) - 50 < M) newPage();

            pages[pages.length - 1].push({ rsum3: true, items: ln.items || [], y: y });
            y -= 50;
            return;
          }
          if (ln.progress) {
            if (ln.phead) {
              if (y - 34 < M) newPage();
              pages[pages.length - 1].push({ progress: true, pct: ln.pct || 0, phead: true, headY: y - 11, y: y - 34 });
              y -= 34;

            }

            y -= 6;
            pages[pages.length - 1].push({ progress: true, pct: ln.pct || 0, y: y - 15 });
            y -= 15;
            return;
          }
          if (ln.keep && y - ln.keep < M) newPage();
          var wrapped = pdfWrap(ln.text, ln.font, ln.size, ln.wrapW || (W - 2 * M - ln.indent));
          wrapped.forEach(function (w, wi) {
            var lh = ln.size * 1.45;
            var gap = wi === 0 ? ln.gap : 0;
            if (y - gap - lh < M) newPage();

            pages[pages.length - 1].push({
              text: w, font: ln.font, size: ln.size,

              y: y - ln.size * 1.08, color: ln.color, tc: ln.tc || 0
            });
            y -= lh;
          });
        });
        var total = pages.length;
        var objs = [];
        objs[1] = "<< /Type /Catalog /Pages 2 0 R >>";
        var kids = [];
        for (var i = 0; i < total; i++) kids.push((6 + i * 2) + " 0 R");

        objs[4] = "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>";
        objs[5] = "<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>";
        var RX = 36, RW = W - 72, IX = 62, IW = RW - 52;
        var NAVY = "0.071 0.247 0.482", NAVYF = NAVY + " rg";

        function rr(x, y, w, h, r) {

            (x + w) + " " + (y + h - r) + " l " + (x + w) + " " + (y + h - k) + " " + (x + w - k) + " " + (y + h) + " " + (x + w - r) + " " + (y + h) + " c " +
            (x + r) + " " + (y + h) + " l " + (x + k) + " " + (y + h) + " " + x + " " + (y + h - k) + " " + x + " " + (y + h - r) + " c " +
            x + " " + (y + r) + " l " + x + " " + (y + k) + " " + (x + k) + " " + y + " " + (x + r) + " " + y + " c h ";
        }
        function bandPath(x, y, w, h, r) {

            (x + w) + " " + (y + h - k) + " " + (x + w - k) + " " + (y + h) + " " + (x + w - r) + " " + (y + h) + " c " +
            (x + r) + " " + (y + h) + " l " + (x + k) + " " + (y + h) + " " + x + " " + (y + h - k) + " " + x + " " + (y + h - r) + " c h ";
        }
        pages.forEach(function (ops, pi) {
