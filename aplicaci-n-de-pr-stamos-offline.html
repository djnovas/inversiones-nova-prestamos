      /* ============ Constructores de líneas para documentos PDF ============ */
      function makeLineWriter(L) {
        function add(text, font, size, gap, indent, color, keep) {
          L.push({ text: String(text), font: font || "F1", size: size || 10.5, gap: gap || 0, indent: indent || 0, color: color || "", keep: keep || 0 });
        }
        function head(text) { add(text, "F2", 13.5, 14, 0, "", 70); L.push({ rule: true }); }
        function brand(subtitle) {
          L.push({ logo: true });
          add("Inversiones Nova R & L", "F2", 19, 0);
          add(subtitle, "F1", 12.5, 2);
          add("Generado el " + fmtDate(todayISO()), "F1", 10, 1, 0, "0.4");
          L.push({ rule: true });
        }
        return { add: add, head: head, brand: brand };
      }
      function fileSlug(s) {
        var t = String(s || "cliente");
        if (t.normalize) t = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        return t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "cliente";
      }
      function estadoLabel(status) {
        return status === "pagada" ? "Pagada" : status === "vencida" ? "Vencida" : "Pendiente";
      }

      /* ============ Recibo de pago en PDF ============ */
      // Posición del pago en el tiempo: cuánto se había pagado antes y después de él,
      // y qué cuota(s) cubre según el plan.
      function paymentInfo(loan, payment) {
        var pays = loanPayments(loan.id);
        var cum = 0, before = 0, after = 0;
        pays.forEach(function (p) {
          if (p.id === payment.id) { before = cum; after = round2(cum + Number(p.amount)); }
          cum = round2(cum + Number(p.amount));
        });
        var acc = 0, startN = null, endN = null;
        loan.installments.forEach(function (inst) {
          var s = acc, e = round2(acc + Number(inst.amount));
          if (startN === null && e > before + 0.001) startN = inst.n;
          if (s < after - 0.001) endN = inst.n;
          acc = e;
        });
        var concepto = "Pago a cuenta";
        if (startN !== null && endN !== null) {
          concepto = startN === endN ? "Cuota #" + startN + " de " + loan.installments.length : "Cuotas #" + startN + " a #" + endN + " de " + loan.installments.length;
        }
        return { before: before, after: after, concepto: concepto, startN: startN, endN: endN, balanceAfter: round2(Number(loan.total) - after) };
      }
      function receiptLines(loan, payment) {
        var c = clientById(loan.clientId);
        var info = paymentInfo(loan, payment);
        var totalCuotas = loan.installments.length;
        // Cuotas ya cubiertas hasta este pago (según el acumulado real pagado).
        var acc = 0, pagadas = 0;
        loan.installments.forEach(function (inst) {
          acc = round2(acc + Number(inst.amount));
          if (acc <= info.after + 0.001) pagadas++;
        });
        var pendientes = totalCuotas - pagadas;
        var pct = Number(loan.total) > 0 ? Math.round(info.after / Number(loan.total) * 100) : 0;
        var MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
        var pd = parseDate(payment.date);
        var fechaLarga = pd.getDate() + " de " + MESES[pd.getMonth()] + " de " + pd.getFullYear();
        var fechaBand = (pd.getDate() < 10 ? "0" : "") + pd.getDate() + " / " + (pd.getMonth() + 1 < 10 ? "0" : "") + (pd.getMonth() + 1) + " / " + pd.getFullYear();
        var conceptoMuestra = "Pago a cuenta";
        if (info.startN !== null && info.endN !== null) {
          conceptoMuestra = info.startN === info.endN ? "Pago de cuota #" + info.startN + " de " + totalCuotas : "Pago de cuotas #" + info.startN + " a #" + info.endN + " de " + totalCuotas;
        }
        var NAVYC = "0.071 0.247 0.482", GRAYC = "0.392 0.455 0.545", DARKC = "0.102 0.137 0.196";
        var IXL = 62, IWL = 488;
        var L = [];
        L.push({ band: true, title: "Inversiones Nova R & L", sub: "Recibo de Pago", meta: fechaBand, h: 86, after: 18 });
        L.push({ cols: true, left: "DATOS DEL CLIENTE", right: "DATOS DEL PRÉSTAMO", font: "F2", size: 9.5, gap: 0, color: NAVYC, tc: 1.6, x: IXL, w: IWL });
        L.push({ cols: true, left: "Cliente:", right: "Monto del préstamo:", font: "F1", size: 11.5, gap: 5, color: GRAYC, x: IXL, w: IWL });
        L.push({ cols: true, left: c ? c.name : "Cliente", right: money(loan.amount), fontL: "F2", fontR: "F2", size: 12.5, gap: 1, color: DARKC, x: IXL, w: IWL });
        L.push({ cols: true, left: "Concepto:", right: "Saldo restante:", font: "F1", size: 11.5, gap: 10, color: GRAYC, x: IXL, w: IWL });
        L.push({ cols: true, left: conceptoMuestra, right: money(info.balanceAfter), fontL: "F1", fontR: "F2", sizeL: 12.5, sizeR: 12.5, size: 12.5, gap: 1, color: DARKC, x: IXL, w: IWL });
        L.push({ cols: true, left: "Fecha del pago:", right: "Cuotas:", font: "F1", size: 11.5, gap: 10, color: GRAYC, x: IXL, w: IWL });
        L.push({ cols: true, left: fechaLarga, right: pagadas + " pagadas de " + totalCuotas, font: "F1", size: 12.5, gap: 1, color: DARKC, x: IXL, w: IWL });
        L.push({ text: "CUOTAS PENDIENTES", font: "F2", size: 9.5, gap: 18, indent: 0, color: NAVYC, tc: 1.6, x: IXL, wrapW: IWL, keep: 0 });
        L.push({ rbox: true, left: "Cuotas pendientes", right: pendientes + " de " + totalCuotas, gap: 8 });
        L.push({ text: "AVANCE DEL PRÉSTAMO", font: "F2", size: 9.5, gap: 18, indent: 0, color: NAVYC, tc: 1.6, x: IXL, wrapW: IWL, keep: 0 });
        L.push({ progress: true, pct: pct, phead: true });
        L.push({ rsum3: true, gap: 10, items: [
          { label: "Cuotas pagadas", value: pagadas + " cuotas pagadas de " + totalCuotas },
          { label: "Total pagado", value: money(info.after) },
          { label: "Total pendiente", value: money(info.balanceAfter) }
        ] });
        if (payment.note) L.push({ text: "Nota: " + payment.note, font: "F1", size: 10.5, gap: 2, indent: 0, color: GRAYC, x: IXL, wrapW: IWL, keep: 0 });
        L.push({ ramount: true, label: "MONTO RECIBIDO", value: money(payment.amount), gap: 16 });
        var notaPie = "Gracias por su pago. Conserve este recibo como comprobante de " + (info.startN !== null && info.endN !== null ? (info.startN === info.endN ? "la cuota #" + info.startN : "las cuotas #" + info.startN + " a #" + info.endN) : "su pago") + ".";
        if (pendientes > 0) notaPie += " Su próximo pago corresponde a la cuota #" + (pagadas + 1) + ".";
        else notaPie += " Con este pago su préstamo queda saldado.";
        L.push({ text: notaPie, font: "F1", size: 10.5, gap: 14, indent: 0, color: GRAYC, x: IXL, wrapW: IWL, keep: 0 });
        L.push({ frame: true });
        return L;
      }

      }
      function deactivateSync() {
        openConfirm("Desactivar sincronización", "La app dejará de subir y bajar datos de Supabase. Los datos de este teléfono no se borran y la copia cifrada seguirá guardada en Supabase.", "Desactivar", function () {
          saveSyncCfg({ enabled: false, keyJwk: null });
          syncUi = { msg: "", kind: "" };
          render();
          toast("Sincronización desactivada.");
        });
      }
      window.addEventListener("online", function () { if (isLoggedIn()) syncNow({ silent: true }); });

      /* ================= Inicio ================= */
      if (isLoggedIn()) showApp();
      else showLogin();
    </script>
  </body>
</html>
